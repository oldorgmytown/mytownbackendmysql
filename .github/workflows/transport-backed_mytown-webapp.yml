name: Build and deploy container app to Azure Web App - mytown-webapp

on:
  push:
    branches:
      - transport-backed
      - backend-PROD
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: mytownacr.azurecr.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_54D4782667834534A27B73A2F1F02450 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D0F77C7144BA492086A893EA0AF8A5C4 }}

      - name: Build and push container image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            mytownacr.azurecr.io/mytown-app:${{ github.sha }}
            mytownacr.azurecr.io/mytown-app:latest
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v2
        with:
          app-name: mytown-webapp
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: mytownacr.azurecr.io/mytown-app:${{ github.sha }}  # ← Fixed: was latest, now sha