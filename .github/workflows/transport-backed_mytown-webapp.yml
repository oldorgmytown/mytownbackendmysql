name: Build and deploy container app to Azure Web App - mytown-webapp

on:
  push:
    branches:
      - transport-backed
      - backend-QA
      - backend-PROD
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: mytownacr.azurecr.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: mytownacr.azurecr.io/mytown-app:${{ github.sha }}

# -------- DEV --------
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/transport-backed'

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Dev Slot
        uses: azure/webapps-deploy@v2
        with:
          app-name: mytown-webapp
          slot-name: dev
          images: mytownacr.azurecr.io/mytown-app:${{ github.sha }}

# -------- QA (STAGING) --------
  deploy-qa:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/backend-QA'

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v2
        with:
          app-name: mytown-webapp
          slot-name: staging
          images: mytownacr.azurecr.io/mytown-app:${{ github.sha }}

# -------- PROD --------
  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/backend-PROD'

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production
        uses: azure/webapps-deploy@v2
        with:
          app-name: mytown-webapp
          slot-name: Production
          images: mytownacr.azurecr.io/mytown-app:${{ github.sha }}
