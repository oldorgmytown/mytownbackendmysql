trigger:
  branches:
    include:
      - transport-backed
      - backend-QA
      - backend-PROD

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'mytown-app'
  acrLoginServer: 'mytownacr.azurecr.io'
  webAppName: 'mytown-webapp'
  resourceGroup: 'CICDRG'

stages:

# -------- BUILD & PUSH --------
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: Build and Push to ACR
      inputs:
        containerRegistry: 'ACR-Service-Connection'
        repository: $(imageName)
        command: buildAndPush
        Dockerfile: '**/Dockerfile'
        tags: latest

# -------- DEV DEPLOY --------
- stage: Deploy_Dev
  displayName: Deploy to Dev Slot
  dependsOn: Build
  condition: eq(variables['Build.SourceBranchName'], 'transport-backed')
  jobs:
  - job: DeployDev
    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy to Dev Slot
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        appName: $(webAppName)
        resourceGroupName: $(resourceGroup)
        deployToSlotOrASE: true
        slotName: dev
        containers: $(acrLoginServer)/$(imageName):latest

# -------- STAGING DEPLOY --------
- stage: Deploy_Staging
  displayName: Deploy to Staging Slot
  dependsOn: Build
  condition: eq(variables['Build.SourceBranchName'], 'backend-QA')
  jobs:
  - job: DeployStaging
    steps:
    - task: AzureWebAppContainer@1
      displayName: Deploy to Staging Slot
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        appName: $(webAppName)
        resourceGroupName: $(resourceGroup)
        deployToSlotOrASE: true
        slotName: staging
        containers: $(acrLoginServer)/$(imageName):latest

# -------- PRODUCTION (SWAP) --------
- stage: Deploy_Production
  displayName: Swap Staging to Production
  dependsOn: Build
  condition: eq(variables['Build.SourceBranchName'], 'backend-PROD')
  jobs:
  - job: Swap
    steps:
    - task: AzureAppServiceManage@0
      displayName: Swap Staging to Production
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        Action: Swap Slots
        WebAppName: $(webAppName)
        ResourceGroupName: $(resourceGroup)
        SourceSlot: staging
