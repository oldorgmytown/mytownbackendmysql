trigger:
- transport-backed   

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'mytown-app'
  acrLoginServer: 'mytownacr.azurecr.io'

stages:

# -------- BUILD & PUSH --------
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: Build
    steps:

    - task: Docker@2
      displayName: Build and Push to ACR
      inputs:
        containerRegistry: 'ACR-Service-Connection'
        repository: 'mytown-app'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          latest

# -------- DEPLOY --------
- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: Build
  jobs:
  - job: Deploy
    steps:

    - task: AzureWebAppContainer@1
      displayName: Deploy to Web App
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        appName: 'mytown-webapp'   
        containers: 'mytownacr.azurecr.io/mytown-app:latest'